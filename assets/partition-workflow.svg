<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Partition and recovery workflow</title><desc id="desc">An isolated old leader has one vote. Two connected nodes can elect a new leader. On reconnection, higher-term messages trigger step-down and conflicting logs are repaired.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6aa9ff"/></marker></defs><rect width="1200" height="630" rx="24" fill="#0b1220"/>
<text x="48" y="53" fill="#59dfb6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">FAILURE WORKFLOW / THREE-NODE CLUSTER</text>
<text x="48" y="101" fill="#edf4ff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">A partition changes who can make progress.</text>
<rect x="48" y="145" width="330" height="242" rx="14" fill="#142136" stroke="#6aa9ff" stroke-opacity="0.6"/>
<text x="70" y="179" fill="#6aa9ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">01 / Before partition</text>
<text x="70" y="211" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Node A leads term T</text>
<text x="70" y="238" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A → B: replicate</text>
<text x="70" y="265" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A → C: replicate</text>
<text x="70" y="292" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Majority can commit</text>
<rect x="435" y="145" width="330" height="242" rx="14" fill="#142136" stroke="#b9a1ff" stroke-opacity="0.6"/>
<text x="457" y="179" fill="#b9a1ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">02 / Network splits</text>
<text x="457" y="211" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A isolated: only 1 of 3</text>
<text x="457" y="238" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">B + C stay connected</text>
<text x="457" y="265" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">They can elect a leader</text>
<text x="457" y="292" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">in a newer term</text>
<rect x="822" y="145" width="330" height="242" rx="14" fill="#142136" stroke="#59dfb6" stroke-opacity="0.6"/>
<text x="844" y="179" fill="#59dfb6" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">03 / Reconnection</text>
<text x="844" y="211" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A observes higher term</text>
<text x="844" y="238" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A becomes a follower</text>
<text x="844" y="265" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">New leader repairs</text>
<text x="844" y="292" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">the conflicting suffix</text>
<path d="M383 263 L426 263" stroke="#6aa9ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M771 263 L814 263" stroke="#6aa9ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="428" width="1104" height="118" rx="14" fill="#142136"/>
<text x="72" y="467" fill="#59dfb6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">The majority determines progress.</text>
<text x="72" y="504" fill="#edf4ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">An isolated old leader cannot newly commit a proposal on its own.</text>
<text x="48" y="593" fill="#9bafca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Illustrative protocol scenario • not an execution trace or measured result</text>
</svg>